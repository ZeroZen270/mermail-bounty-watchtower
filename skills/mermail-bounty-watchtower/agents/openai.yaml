interface:
  display_name: "Mermail Bounty Watchtower"
  short_description: "Deadline guardian for bounty hunters — tracks scaffolded bounties, scores submission readiness, flags at-risk deadlines. Read-only on the mailbox."
  default_prompt: "Use $mermail-bounty-watchtower to triage bounty mail and watch submission deadlines safely."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
